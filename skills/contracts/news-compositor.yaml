kind: compositor
contract_version: "1.0"
display_name: 新闻主持人栏目视频合成
required_inputs:
  - anchor_video_path
  - media_plan
  - timeline
  - insert_media_paths
  - audio_path
  - source_sidecar_records
required_outputs:
  - master_video_path
  - timeline_report
supported_aspect_ratios:
  - "9:16"
max_duration_seconds: 90
real_generation_enabled: false
safety_constraints:
  - 输出1080x1920、25fps、H.264、AAC 48kHz单声道无字净版
  - 不烧录字幕、标题、来源条、平台角标、账号标识或Logo
  - 不添加背景音乐；常规新闻不映射或混入素材原声，参考视频复刻按用户要求保留插播素材原声时，须将原声响度对齐主持人并做淡入淡出
  - 插播在1080x1920画布上横向撑满1080宽度、等比缩放、垂直居中，只留上下黑边；禁止左右黑边，禁止拉伸变形
  - 主持人开头只抛出现象或悬念，结尾只做总结升华和教育意义；插播已讲清的事实、含义和过程不得由主持人口播复述
  - 来源URL、下载时间、文件哈希和AI生成信息只写入旁路记录
  - 插播镜头连续正向播放，禁止倒放、循环或乒乓播放
  - 保持时间线无间隙无重叠，并以连续主持人画面完整收尾
  - 不复制参考视频Logo、栏目名、文字、音乐和版式
  - 用户交付只提供已验证的MP4及明确列出的旁路文件，不创建或提供ZIP/压缩交付包
