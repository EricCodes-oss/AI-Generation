kind: quality_control
contract_version: "1.0"
display_name: 新闻视频质量与安全检查
required_inputs:
  - master_video_path
  - news_script
  - media_plan
  - timeline
  - host_identity_record
  - voice_identity_record
  - provenance_records
  - automatic_qc_evidence
  - director_review
required_outputs:
  - passed
  - report_path
  - issues
  - identity_check
  - timeline_check
  - ending_check
supported_aspect_ratios:
  - "9:16"
max_duration_seconds: 90
real_generation_enabled: false
safety_constraints:
  - 核验锁定主持人ID、参考图SHA-256和固定未来科技解说音色ID
  - 检查事实素材匹配、来源旁路记录、下载文件哈希和无水印准入记录
  - 检查H.264、1080x1920、25fps、AAC 48kHz单声道和45至90秒时长
  - 检查黑帧、异常静音、解码错误、音频母版一致性、口型和五官自然度
  - 检查时间线无间隙无重叠、无倒放循环，并以连续主持人结尾完整收束
  - 检查无字幕、标题、来源条、Logo、音乐和素材原声的无字净版规则
  - 自动QC通过后仍必须完成导演审核才能交付
  - 语音比对按时间线逐句复核；整片字符相似度不足以证明无漏句，整片ASR漏识别一整句时相似度可能只小幅下降，缺句必须回查原始音频并记录是ASR漏识别还是音频缺句
  - 数字人与插播源分辨率必须核对：宽度低于1080或明显偏离锁定主持人比例的产物判不合格并重新生成，不得放大充数
  - 照片平移、贴图等无连续实拍动作的镜头记static_source=true；此类镜头freezedetect永远测不到冻结，检测通过不等于有连续动作，用户指定使用时列为override
  - 插播镜头标签必须与实际画面一致：整段渲染前对每个镜头源区间抽首帧、中帧、末帧确认，场景切换检测区间只是候选
  - 逐字使用他人文稿须记录授权来源、范围与确认时间；交互选项的点选不构成授权凭证
  - 事实存疑的句子按用户决定保留时，须在QC报告单列fact_flags，不得因用户选择而写成已核实
