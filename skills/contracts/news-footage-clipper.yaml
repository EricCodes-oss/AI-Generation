kind: footage_clipper
contract_version: "1.0"
display_name: 原始新闻视频合规截取
required_inputs:
  - source_reference
  - source_url
  - downloaded_at
  - source_sha256
  - clip_start_seconds
  - clip_end_seconds
  - script_segment_id
  - semantic_role
  - usage_basis
required_outputs:
  - asset_path
  - provenance_record
  - shot_selection_record
supported_aspect_ratios:
  - "9:16"
max_duration_seconds: 90
real_generation_enabled: false
safety_constraints:
  - 保留来源URL、下载时间、文件哈希、截取区间和使用依据旁路记录
  - 素材须无水印、无平台角标、无账号标识、无烧录字幕
  - 无水印只代表满足项目画面准入规则，不代表已经获得版权授权
  - 每个插播镜头必须映射到明确脚本段落和语义角色
  - 只截取动作连续、时间顺序正常的连续正向镜头
  - 禁止倒放、循环、乒乓播放或通过剪辑改变原始语义
  - 参考视频复刻开工前先向用户确认插播来源（参考视频原片、同源影视片段或AI生成）；用户要求“插播用参考视频”时直接以参考视频原片作插播，不另找同题材影视、不AI生成、不自行拼接改写
  - 分析或剪辑前核对文件的BVID、标题和时长与用户给出的参考视频一致，不得把候选素材误当参考视频
  - 去除烧录字幕前先逐行测量字幕顶边和人名条坐标，只裁掉字幕所在最小条带并留3行余量，不得为去字幕把画面压成宽银幕比例
  - 画面内人名条、角标按出现时段分区delogo；参考视频末尾的黑场、片尾卡、平台引导卡必须截去
  - 资料册、展板编号等剧情道具文字可以保留，但须在素材台账中逐条注明为剧情道具
  - 镜头标签先验后渲染：每个镜头源区间先抽首帧、中帧、末帧确认画面与标签一致，再批量渲染；转场虚化和静帧平移常被场景检测误标
  - 静态源镜头（照片平移、贴图）记static_source=true，并在素材台账注明非连续实拍动作
