kind: news_script_writer
contract_version: "1.0"
display_name: 热点新闻解读脚本
required_inputs:
  - verified_topic
  - authoritative_source_evidence
  - verified_facts
  - audience_context
  - target_duration_seconds
required_outputs:
  - title
  - spoken_segments
  - script_segment_ids
  - source_ids
  - script_review_record
supported_aspect_ratios:
  - "9:16"
max_duration_seconds: 90
real_generation_enabled: false
safety_constraints:
  - 口播稿控制在45至90秒，并使用短句、清晰信息层级和新闻联播式权威表达
  - 严格区分事实、背景、影响和结论，所有关键事实必须能追溯到权威来源
  - 每条口播必须完成“表述现象—说明本质—给出启发”三层表达；主持人不能只复述画面，必须提供观众从画面中得不到的判断或意义
  - 不使用类似转述编辑过程的措辞代替权威新闻陈述
  - 开头直接陈述事件、时间、地点或核心影响，不使用“近日在平台上引发关注”“我们先看画面”“让我们先看画面”“请看画面”等引导观看或描述剪辑动作的套话
  - 结尾必须为完整句并自然收束，不使用可删除的空泛提醒
  - 不补写来源没有支持的事实，不做医疗法律金融等高风险断言
  - 逐字复刻参考口播时先按默认音色估算朗读时长并与可用画面总长比较，再决定切句方案和提交TTS；不得等配音完成才发现旁白超长
  - 默认音色约4字每秒、参考原解说常为6至7字每秒，同一段文字所需时长可能相差近一倍
  - 旁白超长时先整段匀速加速并记录atempo与最终字每秒；把插播句子移进主持人开头或收尾属于内容结构改动，必须先征求用户意见，即使用字未改
